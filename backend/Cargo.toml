[package]
name = "nex-backend"
version = "0.1.0"
edition = "2024"
description = "Backend NEX : detient la cle Riot, mutualise et met en cache les appels publics."

[dependencies]
nex-domain = { workspace = true }
nex-mayhem = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
dotenvy = "0.15.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
