[workspace]
members = ["src-tauri", "backend", "crates/nex-domain", "crates/nex-mayhem"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "native-tls"] }
nex-domain = { path = "crates/nex-domain" }
nex-mayhem = { path = "crates/nex-mayhem" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
