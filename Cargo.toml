[workspace]
members = ["src-tauri", "backend", "crates/nex-domain", "crates/nex-mayhem"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "native-tls"] }
nex-domain = { path = "crates/nex-domain" }
nex-mayhem = { path = "crates/nex-mayhem" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# `panic = "abort"` etait le choix d'origine, pour la taille du binaire. Il a coute cher :
# une panique dans n'importe quelle tache de fond — sondage du client League, collecteur,
# capture — emportait toute l'application, overlay compris, en pleine partie. Vu cinq fois
# le 15 novembre 2026. En deroulant, la tache fautive meurt seule, le reste survit, et le
# hook de `paniques.rs` ecrit ce qui s'est passe. Quelques dizaines de kilo-octets contre
# une application qui reste debout : le compte est vite fait.
panic = "unwind"
strip = true
